<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="hsl(224 71.4% 4.1%)" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link
			href="%sveltekit.assets%/favicon-light.png"
			rel="icon"
			media="(prefers-color-scheme: light)"
		/>
		<link
			href="%sveltekit.assets%/favicon-dark.png"
			rel="icon"
			media="(prefers-color-scheme: dark)"
		/>
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon-180x180.png" />
		<link href="%sveltekit.assets%/manifest.json" rel="manifest" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
